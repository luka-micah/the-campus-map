name: the_campus_map
description: "BOUESTI Campus Map — navigate campus buildings with turn-by-turn voice directions."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0-293.0.dev

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management, navigation, DI
  get: ^4.6.6

  # Backend
  supabase_flutter: ^2.8.4

  # Map rendering
  google_maps_flutter: ^2.10.0

  # GPS
  geolocator: ^13.0.4

  # Voice
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.3

  # Persistence
  shared_preferences: ^2.5.3

  # Data structures (HeapPriorityQueue for Dijkstra)
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Unit & property-based testing
  test: ^1.25.15
  mocktail: ^1.0.4
  kiri_check: ^1.3.1

flutter:
  uses-material-design: true
